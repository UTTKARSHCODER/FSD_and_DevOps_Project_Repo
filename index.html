<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistration Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">    
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1 style="text-align: center;">Registeraton Page</h1>
        </div>
        <div class="main-content mx-auto mt-5 " style="padding: 1rem; max-width: 30rem; border: 2px solid black; border-radius: 10px;">
            <form action="" class="needs-validation" novalidate>
                <div class="username">
                    <label for="username" class="form-label">UserName: </label>
                    <input type="text" placeholder="Enter your Name" id="username" class="form-control" required>
                    <div class="invalid-feedback">
                        Please Enter your name
                    </div>
                </div>
                <div class="email mt-3">
                    <label for="mail" class="form-label">Email: </label>
                    <input type="email" placeholder="Enter your Email" id="mail" class="form-control" required>
                    <div class="invalid-feedback">
                        Please Enter your Email-Id
                    </div>
                </div>
                <div class="phone mt-3">
                    <label for="no" class="form-label">Phone Number: </label>
                    <input type="tel" maxlength="10" minlength="0" placeholder="Enter your Mobile Number" id="no" class="form-control" required>
                    <div class="invalid-feedback">
                        Please Enter your Phone Number
                    </div>
                </div>
                <div class="branch mt-3">
                    <label for="selection">Branch: </label>
                    <select name="branch" id="selection" class="form-control" required>
                        <option value="" selected disabled>Selct Your Branch from here</option>
                        <option value="CSE">CSE</option>
                        <option value="CSE(AI)">CSE (AI)</option>
                        <option value="CSE(DS)">CSE (DS)</option>
                        <option value="EE">EE</option>
                        <option value="ME">ME</option>
                    </select>
                    <div class="invalid-feedback">
                        Please Select your Branch
                    </div>
                </div>
                <div class="branch mt-3">
                    <label for="pass">Password: </label>
                    <input type="password" placeholder="Please enter your password" class="form-control" required>
                    <div class="invalid-feedback">
                        Please Enter your Password
                    </div>
                </div>
                <div class="submit mt-3 mt-3">
                    <button type="submit" class="btn btn-outline-success mx-auto w-70 d-flex justify-content-center" >Submit</button>
                    <div class="invalid-feedback">
                        Please Enter your name
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="registration.js"></script>
</body>
</html>
